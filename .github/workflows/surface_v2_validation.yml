name: Pause surface v2 history backfill

on:
  pull_request:
    branches:
      - main
    paths:
      - "validation-trigger.txt"

permissions:
  contents: read

concurrency:
  group: finish-surface-v2-history-backfill
  cancel-in-progress: true

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pause historical fetches during storage upgrade
        run: echo "Historical backfill paused while GEX-capable surface storage is upgraded."
