name: Manual full options snapshot

on:
  # Deliberately manual-only. Automatic options collection is handled by
  # daily_skew.yml after the historical rollover so it can share one <100-credit
  # budget across IV, GEX and volume data.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.daily_snapshot
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MIN_DTE: ${{ vars.MIN_DTE }}
          MAX_DTE: ${{ vars.MAX_DTE }}
