# Copy this file to .streamlit/secrets.toml for local development.
# Never commit secrets.toml.
MARKETDATA_TOKEN = "paste_your_marketdata_app_token_here"

# Use the server-only secret key because the database table is locked behind RLS.
SUPABASE_URL = "https://your-project.supabase.co"
SUPABASE_SECRET_KEY = "paste_your_sb_secret_key_here"

# Automatically upsert a snapshot whenever fresh data is loaded.
AUTO_SAVE_SNAPSHOTS = true
