name: Upgrade Jan-Jun 2026 to full surface v3

on:
  pull_request:
    branches:
      - main
    paths:
      - "validation-trigger.txt"

permissions:
  contents: read

concurrency:
  group: upgrade-jan-jun-2026-surface-v3
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests before paid requests
        run: PYTHONPATH=. pytest -q --ignore=tests/test_app_smoke.py

      - name: Wait for MarketData one-device cooldown
        run: sleep 330

      - name: Upgrade Jan 2 through Jun 22 to full surface v3
        env:
          PYTHONUNBUFFERED: "1"
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=. python -u scripts/backfill_surface_v3.py \
            --symbols AUTO \
            --start 2026-01-02 \
            --end 2026-06-22 \
            --max-requests 5523 \
            --credit-reserve 100 \
            --probe-symbol SPY
