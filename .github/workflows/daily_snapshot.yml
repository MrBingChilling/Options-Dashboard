name: Save daily options snapshots

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC Tuesday-Saturday = after the prior US market session closes.
    - cron: "0 1 * * 2-6"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.daily_snapshot
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MIN_DTE: ${{ vars.MIN_DTE }}
          MAX_DTE: ${{ vars.MAX_DTE }}
