name: Daily IV and GEX surface snapshot

on:
  # 07:10 Vancouver = 10:10 New York, safely after MarketData's 09:30 ET
  # historical-options rollover. Historical chains are one trading day old, so
  # Friday becomes available on Monday. Backup triggers share the same Supabase
  # credit ledger and request only tickers whose 1W + 1M 25D rows are missing.
  schedule:
    - cron: "10 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "25 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "40 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "55 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "10 8 * * 1-5"
      timezone: "America/Vancouver"
  workflow_dispatch:

concurrency:
  group: daily-iv-gex-surface
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect latest historical IV and GEX surface
        env:
          PYTHONUNBUFFERED: "1"
          DAILY_MARKETDATA_CREDIT_LIMIT: "99"
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=. python -u scripts/daily_skew.py

      - name: Recompute recent constant-maturity history from saved archives
        if: ${{ always() }}
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=. python -u scripts/recompute_constant_maturity.py --days 45
