name: Daily 25D skew snapshot

on:
  # Primary weekday run at 07:10 Vancouver time, with backup trigger
  # opportunities through 08:10. The collector checks Supabase first and
  # exits with 0 MarketData requests when the session is already complete.
  schedule:
    - cron: "10 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "25 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "40 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "55 7 * * 1-5"
      timezone: "America/Vancouver"
    - cron: "10 8 * * 1-5"
      timezone: "America/Vancouver"
  workflow_dispatch:
  # Temporary one-commit trigger so today's missed scheduled collection runs.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily_skew.yml"

concurrency:
  group: daily-25d-skew
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect latest historical 25D skew
        env:
          PYTHONUNBUFFERED: "1"
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=. python -u scripts/daily_skew.py
