name: Finish surface v3 GEX history backfill

on:
  pull_request:
    branches:
      - main
    paths:
      - "validation-trigger.txt"

permissions:
  contents: read

concurrency:
  group: finish-surface-v2-history-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run surface v3 storage and credit-priority tests
        run: PYTHONPATH=. pytest -q --ignore=tests/test_app_smoke.py

      - name: Resume remaining historical data only
        env:
          PYTHONUNBUFFERED: "1"
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=. python -u scripts/backfill_surface_v3.py \
            --symbols AUTO \
            --start 2025-08-13 \
            --end 2026-08-12 \
            --max-requests 9000 \
            --credit-reserve 100 \
            --probe-symbol SPY
